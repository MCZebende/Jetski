<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf8ff" />
  <title>JetSkiNav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,500,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="phone">
    <header class="top" id="header"></header>
    <main class="view" id="view"></main>
    <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
  </div>
  <div class="lock-screen" id="lock" hidden>
    <div class="lock-card">
      <span class="ms fill">water_drop</span>
      <p>TELA BLOQUEADA CONTRA RESPINGOS</p>
      <button class="btn btn-navy" type="button" data-action="unlock">DESBLOQUEAR</button>
    </div>
  </div>
  <div class="sheet-backdrop" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
